<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 490">
  <style>
    #silkscreen-x:target ~ * { --silkscreen-x: -1; }
    #silkscreen-y:target ~ * { --silkscreen-y: -1; }
    text {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(var(--silkscreen-x, 1), var(--silkscreen-y, 1));
    }
  </style>
  <g id="silkscreen-x"/>
  <g id="silkscreen-y"/>
  <defs>
    <linearGradient id="pcb" x2="1" y2="1">
      <stop stop-color="#45494c"/><stop offset=".52" stop-color="#313437"/><stop offset="1" stop-color="#24272a"/>
    </linearGradient>
    <linearGradient id="gold" x2="1" y2="1">
      <stop stop-color="#fff2bf"/><stop offset=".46" stop-color="#dfc58b"/><stop offset="1" stop-color="#a78349"/>
    </linearGradient>
    <linearGradient id="metal" x2="1" y2="1">
      <stop stop-color="#a8aeac"/><stop offset=".34" stop-color="#eeede3"/><stop offset="1" stop-color="#777d7c"/>
    </linearGradient>
    <linearGradient id="package" x2="1" y2="1">
