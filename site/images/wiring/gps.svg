<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440">
  <style>
    #silkscreen-x:target ~ * { --silkscreen-x: -1; }
    #silkscreen-y:target ~ * { --silkscreen-y: -1; }
    text {
      transform-box: fill-box;
      transform-origin: center;
      transform: scale(var(--silkscreen-x, 1), var(--silkscreen-y, 1));
    }
  </style>
  <g id="silkscreen-x"/>
  <g id="silkscreen-y"/>
  <defs>
    <linearGradient id="pcb" x2="1" y2="1">
      <stop stop-color="#363d46"/>
      <stop offset=".55" stop-color="#242a33"/>
      <stop offset="1" stop-color="#161a21"/>
    </linearGradient>
    <linearGradient id="metal" x2="1" y2="1">
      <stop stop-color="#f8f6e9"/>
      <stop offset=".42" stop-color="#8b9193"/>
      <stop offset=".72" stop-color="#d7d6ca"/>
      <stop offset="1" stop-color="#747b7e"/>
    </linearGradient>
    <linearGradient id="ceramic" x2="1" y2="1">
      <stop stop-color="#fffdf3"/>
      <stop offset=".54" stop-color="#edeade"/>
      <stop offset="1" stop-color="#d9d6c9"/>
    </linearGradient>
    <linearGradient id="gold" x2="1" y2="1">
      <stop stop-color="#fff0aa"/>
      <stop offset=".52" stop-color="#dfc178"/>
      <stop offset="1" stop-color="#ae8843"/>
    </linearGradient>
    <linearGradient id="chip" x2="1" y2="1">
      <stop stop-color="#3e4246"/>
      <stop offset="1" stop-color="#16191d"/>
    </linearGradient>
    <g id="solder-pad">
      <rect x="-13" y="-10" width="26" height="20" rx="2" fill="url(#gold)" stroke="#827047" stroke-width="1.5"/>
      <path d="M-10 6V-7H10" fill="none" stroke="#fff5ca" stroke-opacity=".56"/>
    </g>
    <g id="capacitor">
      <rect x="-11" y="-5" width="22" height="10" rx="2" fill="url(#metal)" stroke="#22262d"/>
      <rect x="-6" y="-5" width="12" height="10" rx="1.5" fill="#b2a584"/>
    </g>
    <g id="resistor">
      <rect x="-9" y="-4" width="18" height="8" rx="1.5" fill="url(#metal)" stroke="#22262d"/>
      <rect x="-5" y="-4" width="10" height="8" rx="1" fill="#373839"/>
    </g>
    <pattern id="pins" width="8" height="9" patternUnits="userSpaceOnUse">
      <rect x="2" width="4" height="9" rx="1" fill="url(#metal)"/>
    </pattern>
  </defs>

  <rect x="10" y="11" width="420" height="418" rx="31" fill="url(#pcb)" stroke="#151820" stroke-width="2.5"/>
  <rect x="14" y="15" width="412" height="410" rx="28" fill="none" stroke="#7d8488" stroke-opacity=".34"/>
  <g fill="none" stroke="#7f898b" stroke-width="1.8" opacity=".28">
    <path d="M125 418v-37l24-27v-25m16 89v-33l18-24v-32m22 89v-46l10-14v-29"/>
    <path d="M245 418v-47l-14-15v-27m54 89v-40l-27-26v-23m67 89v-35l-36-34v-20"/>
    <path d="M64 343h24l11 14v37m231-66h42l22 18v30M33 382v-26l26-22h47"/>
  </g>

  <rect x="35" y="16" width="370" height="309" rx="7" fill="#101319"/>
  <g fill="url(#gold)" stroke="#917d55">
    <rect x="27" y="48" width="15" height="34" rx="2"/><rect x="27" y="249" width="15" height="34" rx="2"/>
    <rect x="398" y="48" width="15" height="34" rx="2"/><rect x="398" y="249" width="15" height="34" rx="2"/>
  </g>
  <rect x="39" y="19" width="362" height="302" rx="5" fill="url(#metal)" stroke="#777f80" stroke-width="2"/>
  <rect x="48" y="27" width="344" height="286" rx="3" fill="url(#ceramic)" stroke="#b0afa4" stroke-width="2"/>
  <path d="M52 308V31h336" fill="none" stroke="#fffdf3" stroke-width="2"/>
  <path d="M53 309h335V33" fill="none" stroke="#a7a89e" stroke-width="2" opacity=".55"/>
  <text x="220" y="176" text-anchor="middle" fill="#666b66" font-family="Arial,sans-serif" font-size="24" font-weight="700" letter-spacing="3">GPS</text>

  <g fill="none" stroke="#c8cdce" stroke-width="1.6" opacity=".66">
    <rect x="26" y="342" width="56" height="51" rx="3"/>
    <rect x="90" y="341" width="29" height="19" rx="2"/><rect x="89" y="367" width="29" height="17" rx="2"/>
    <rect x="27" y="400" width="24" height="16" rx="2"/><rect x="56" y="400" width="40" height="16" rx="2"/>
    <rect x="352" y="349" width="28" height="16" rx="2"/><rect x="384" y="349" width="28" height="16" rx="2"/>
    <rect x="347" y="371" width="36" height="22" rx="3"/><rect x="386" y="371" width="31" height="22" rx="3"/>
  </g>
  <rect x="29" y="337" width="50" height="9" fill="url(#pins)"/>
  <rect x="29" y="389" width="50" height="9" fill="url(#pins)"/>
  <rect x="30" y="344" width="48" height="47" rx="4" fill="url(#chip)" stroke="#11151b" stroke-width="2"/>
  <circle cx="38" cy="352" r="2.3" fill="#8a8b80"/>
  <use href="#resistor" x="39" y="408"/><use href="#capacitor" x="76" y="408"/>
  <use href="#resistor" x="104" y="351"/><use href="#capacitor" x="104" y="375"/>
  <use href="#resistor" x="366" y="357"/><use href="#resistor" x="398" y="357"/>
  <use href="#capacitor" x="365" y="382"/><use href="#capacitor" x="402" y="382"/>
  <g fill="#a2a799" opacity=".66">
    <circle cx="129" cy="344" r="3"/><circle cx="154" cy="344" r="3"/><circle cx="179" cy="344" r="3"/>
    <circle cx="205" cy="344" r="3"/><circle cx="230" cy="344" r="3"/><circle cx="256" cy="344" r="3"/>
    <circle cx="281" cy="344" r="3"/><circle cx="307" cy="344" r="3"/>
    <circle cx="367" cy="407" r="3"/><circle cx="395" cy="411" r="3"/>
  </g>

  <g>
    <use href="#solder-pad" x="125" y="417"/><use href="#solder-pad" x="165" y="417"/>
    <use href="#solder-pad" x="205" y="417"/><use href="#solder-pad" x="245" y="417"/>
    <use href="#solder-pad" x="285" y="417"/><use href="#solder-pad" x="325" y="417"/>
  </g>
  <g fill="#f0eee4" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="15">
    <text x="125" y="400">TX</text><text x="165" y="400">RX</text><text x="205" y="400">GND</text>
    <text x="245" y="400">VCC</text><text x="285" y="400">SCL</text><text x="325" y="400">SDA</text>
  </g>
</svg>
