<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 572 582">
  <style>
    #silkscreen-x:target ~ * { --silkscreen-x: -1; }
    #silkscreen-y:target ~ * { --silkscreen-y: -1; }
    text {
      transform-box: fill-box;
      transform-origin: center;
      transform: rotate(calc(-1 * var(--silkscreen-angle, 0deg)))
        scale(var(--silkscreen-x, 1), var(--silkscreen-y, 1))
        rotate(var(--silkscreen-angle, 0deg));
    }
  </style>
  <g id="silkscreen-x"/>
  <g id="silkscreen-y"/>
